name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8/3.9 entsprechen dem Python, das DSM 7 mitbringt
          - { python: "3.8", os: ubuntu-22.04 }
          - { python: "3.9", os: ubuntu-latest }
          - { python: "3.11", os: ubuntu-latest }
          - { python: "3.13", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  spk:
    name: SPK bauen
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./synology/build_spk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zeiterfassung-spk
          path: dist/*.spk
          retention-days: 14
