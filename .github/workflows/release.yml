name: Release

# Neues Release: Version in app/__init__.py und CHANGELOG.md eintragen und committen. Dann entweder
# - auf GitHub: Actions → Release → „Run workflow“ (legt den Tag v<version> selbst an), oder
# - per Kommandozeile: `git tag v0.8.1 && git push origin v0.8.1`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP=$(python -c "import app; print(app.__version__)")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            if [ "$APP" != "${TAG#v}" ]; then
              echo "::error::Tag $TAG passt nicht zu app/__init__.py ($APP)"; exit 1
            fi
          else
            TAG="v$APP"   # per Knopf gestartet: Tag aus der Version im Code
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::error::Release $TAG gibt es schon – erst die Version in app/__init__.py erhöhen"; exit 1
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Tests
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: SPK bauen
        run: |
          ./synology/build_spk.sh
          cd dist && sha256sum *.spk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Release-Notizen aus CHANGELOG.md
        run: |
          V="${TAG#v}"
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[[0-9]/ {next}
            on {print}
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Installation"
            echo "SPK herunterladen → DSM → Paket-Zentrum → Manuelle Installation (DSM 7, x86_64, z. B. DS918+)."
          } >> notes.md
          cat notes.md

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.spk dist/SHA256SUMS.txt --target "$GITHUB_SHA" \
            --title "Zeiterfassung $TAG" --notes-file notes.md
