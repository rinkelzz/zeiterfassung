<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f6e64">
<title>Zeiterfassung – Kiosk</title>
<link rel="icon" href="static/icon.png">
<link rel="apple-touch-icon" href="static/icon.png">
<style>
:root { --bg: #f2f4f7; --card: #fff; --text: #17202a; --muted: #667085; --accent: #0f6e64; --accent-ink: #fff;
        --in: #12a150; --out: #d4380d; --line: #e3e7ee; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #11161c; --card: #1b232c; --text: #e8edf2; --muted: #93a0ae; --line: #2a3542; --accent: #19a394; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 18px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
header { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; }
header .title { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 22px; }
header img { width: 36px; height: 36px; border-radius: 8px; }
#clock { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
#date { color: var(--muted); font-size: 16px; text-align: right; }
main { padding: 0 28px 28px; }
.hint { color: var(--muted); margin: 0 0 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 18px; min-height: 96px;
  display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 600; cursor: pointer; text-align: left;
  color: var(--text); font-family: inherit; }
.tile:active { transform: scale(.98); }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); flex: none; }
.dot.in { background: var(--in); box-shadow: 0 0 0 4px rgba(18,161,80,.18); }
.panel { max-width: 440px; margin: 10px auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 20px;
  padding: 26px; text-align: center; }
.panel h2 { margin: 0 0 6px; font-size: 26px; }
.pinbox { display: flex; justify-content: center; gap: 12px; margin: 18px 0 20px; height: 22px; }
.pinbox i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); }
.pinbox i.f { background: var(--text); border-color: var(--text); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pad button, .btn { font: inherit; font-size: 28px; font-weight: 600; padding: 18px 0; border-radius: 14px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); cursor: pointer; }
.pad button:active, .btn:active { filter: brightness(.92); }
.btn { width: 100%; font-size: 26px; margin-top: 14px; padding: 22px 0; }
.btn.go-in { background: var(--in); color: #fff; border-color: transparent; }
.btn.go-out { background: var(--out); color: #fff; border-color: transparent; }
.btn.ghost { font-size: 18px; padding: 12px 0; background: transparent; color: var(--muted); }
.err { color: var(--out); min-height: 24px; margin-top: 10px; font-weight: 600; }
.big { font-size: 64px; line-height: 1; margin: 6px 0 10px; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="title"><img src="static/icon.png" alt=""><span id="kname">Zeiterfassung</span></div>
  <div><div id="clock">--:--</div><div id="date"></div></div>
</header>
<main>
  <!-- Nicht freigeschaltet -->
  <section id="vNoKey" class="panel hidden">
    <h2>Tablet nicht freigeschaltet</h2>
    <p class="muted">In der Zeiterfassung unter <b>Verwaltung → Kiosk-Tablets</b> einen Zugang erzeugen und
      den QR-Code mit diesem Tablet scannen (oder den Link hier öffnen).</p>
    <div class="err" id="noKeyErr"></div>
  </section>

  <!-- Namen -->
  <section id="vList" class="hidden">
    <p class="hint">Namen antippen, PIN eingeben – fertig. <span class="dot in" style="display:inline-block;vertical-align:-1px;margin-left:6px"></span> = gerade da</p>
    <div class="grid" id="grid"></div>
    <p class="hint" id="empty" style="margin-top:18px"></p>
  </section>

  <!-- PIN -->
  <section id="vPin" class="panel hidden">
    <h2 id="pinName"></h2>
    <div class="muted">PIN eingeben</div>
    <div class="pinbox" id="pinbox"></div>
    <div class="pad" id="pad"></div>
    <div class="err" id="pinErr"></div>
    <button class="btn ghost" data-back>Abbrechen</button>
  </section>

  <!-- Kommen/Gehen -->
  <section id="vAct" class="panel hidden">
    <h2 id="actName"></h2>
    <div class="muted" id="actInfo"></div>
    <button class="btn" id="actBtn"></button>
    <div class="err" id="actErr"></div>
    <button class="btn ghost" data-back>Abbrechen</button>
  </section>

  <!-- Bestätigung -->
  <section id="vDone" class="panel hidden">
    <div class="big" id="doneIcon">✓</div>
    <h2 id="doneTitle"></h2>
    <div class="muted" id="doneMsg"></div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const KEY = "ze_kiosk";
const store = {
  get() { try { return localStorage.getItem(KEY) || ""; } catch (e) { return store.mem || ""; } },
  set(v) { store.mem = v; try { localStorage.setItem(KEY, v); } catch (e) { /* privat */ } },
};
// Schlüssel aus dem Link übernehmen und aus der Adresszeile entfernen
(function () {
  const m = (location.hash || "").match(/[#&]k=(zk_[A-Za-z0-9_\-]+)/);
  if (m) { store.set(m[1]); history.replaceState(null, "", location.pathname); }
})();

const st = { users: [], sel: null, pin: "", status: null, idle: null };
const views = ["vNoKey", "vList", "vPin", "vAct", "vDone"];
function show(v) { views.forEach(x => $(x).classList.toggle("hidden", x !== v)); }
function idle(ms) { clearTimeout(st.idle); if (ms) st.idle = setTimeout(home, ms); }
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, body) {
  const res = await fetch("api/v1/" + path, {
    method: body ? "POST" : "GET", cache: "no-store",
    headers: { "X-Kiosk-Token": store.get(), ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null; try { data = await res.json(); } catch (e) { /* leer */ }
  if (!res.ok) { const err = new Error((data && typeof data.detail === "string") ? data.detail : "Fehler " + res.status); err.status = res.status; throw err; }
  return data;
}

function tick() {
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  $("date").textContent = d.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
}

async function loadUsers() {
  if (!store.get()) { show("vNoKey"); return; }
  try {
    const r = await api("kiosk/users");
    st.users = r.users;
    $("kname").textContent = r.kiosk || "Zeiterfassung";
    $("grid").innerHTML = r.users.map(u => `<button class="tile" data-u="${u.id}"><span class="dot ${u.present ? "in" : ""}"></span>${esc(u.name)}</button>`).join("");
    $("empty").textContent = r.users.length ? "" : "Noch niemand hat eine PIN gesetzt – das geht in der Zeiterfassung unter „Mein Zugang“.";
    if (!st.sel) show("vList");
  } catch (e) {
    if (e.status === 401) { show("vNoKey"); $("noKeyErr").textContent = e.message; }
  }
}

function home() { st.sel = null; st.pin = ""; idle(0); show("vList"); loadUsers(); }

function pick(id) {
  st.sel = st.users.find(u => u.id === id); st.pin = "";
  $("pinName").textContent = st.sel.name; $("pinErr").textContent = "";
  drawPin(); show("vPin"); idle(30000);
}
function drawPin() {
  $("pinbox").innerHTML = Array.from({ length: Math.max(4, st.pin.length) }, (_, i) => `<i class="${i < st.pin.length ? "f" : ""}"></i>`).join("");
}
async function key(k) {
  idle(30000); $("pinErr").textContent = "";
  if (k === "⌫") st.pin = st.pin.slice(0, -1);
  else if (k === "OK") return submitPin();
  else if (st.pin.length < 6) st.pin += k;
  drawPin();
}
async function submitPin() {
  if (st.pin.length < 4) { $("pinErr").textContent = "Mindestens 4 Ziffern"; return; }
  try {
    const r = await api("kiosk/action", { user_id: st.sel.id, pin: st.pin, action: "status" });
    st.status = r.status;
    $("actName").textContent = r.name;
    $("actInfo").textContent = r.status === "in" ? `Eingestempelt seit ${r.since_hhmm} Uhr · heute ${r.today_total} h` : `Nicht eingestempelt · heute ${r.today_total} h`;
    $("actBtn").textContent = r.status === "in" ? "Gehen" : "Kommen";
    $("actBtn").className = "btn " + (r.status === "in" ? "go-out" : "go-in");
    $("actErr").textContent = "";
    show("vAct"); idle(20000);
  } catch (e) { st.pin = ""; drawPin(); $("pinErr").textContent = e.message; }
}
async function act() {
  $("actBtn").disabled = true;
  try {
    const r = await api("kiosk/action", { user_id: st.sel.id, pin: st.pin, action: st.status === "in" ? "out" : "in" });
    const inNow = r.status === "in";
    $("doneIcon").textContent = inNow ? "👋" : "✓";
    $("doneTitle").textContent = inNow ? `Hallo ${r.name}!` : `Tschüss ${r.name}!`;
    $("doneMsg").textContent = r.message || "";
    st.pin = ""; show("vDone"); idle(4000);
  } catch (e) { $("actErr").textContent = e.message; }
  finally { $("actBtn").disabled = false; }
}

$("pad").innerHTML = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "⌫", "0", "OK"].map(k => `<button data-k="${k}">${k}</button>`).join("");
$("pad").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) key(b.dataset.k); });
$("grid").addEventListener("click", e => { const b = e.target.closest("[data-u]"); if (b) pick(Number(b.dataset.u)); });
$("actBtn").onclick = act;
document.querySelectorAll("[data-back]").forEach(b => b.onclick = home);
document.addEventListener("keydown", e => {   // Tastatur am Tablet/PC
  if ($("vPin").classList.contains("hidden")) return;
  if (/^[0-9]$/.test(e.key)) key(e.key); else if (e.key === "Backspace") key("⌫"); else if (e.key === "Enter") key("OK");
});
tick(); setInterval(tick, 1000);
loadUsers(); setInterval(() => { if (!st.sel) loadUsers(); }, 30000);
</script>
</body>
</html>
